name: Fetch ADP Data (Phase 1 - FFC)

# Manual trigger only -- click "Run workflow" on the Actions tab.
# Not scheduled, since FFC's free API asks for max 1 call/day and this
# makes ~20 calls in one run; run it deliberately, not automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-adp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Phase 1 fetcher (FFC API, 2007-2025)
        run: python scripts/ci_fetch_adp_phase1.py

      - name: Show summary
        run: cat data/raw/adp/ffc_fetch_summary.csv

      # data/raw/ is intentionally gitignored across this project (only
      # data/manual/ is meant to be committed -- everything else is
      # supposed to be regenerated by scripts, not version-controlled).
      # So instead of fighting that convention with a forced git add,
      # just hand the results back as a downloadable artifact.
      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffc-adp-raw-data
          path: data/raw/adp/
          retention-days: 14
