name: Fetch MFL Historical ADP Data (2011-2024 backfill)

# Manual trigger only -- click "Run workflow" on the Actions tab.
# Mirrors fetch_adp.yml's structure. mfl_client.py's own throttling
# handles rate limiting between requests; this workflow does not add
# a schedule since a historical backfill is a one-time (or occasional
# re-run for a specific season) deliberate act, not something to run
# automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-mfl-historical:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run historical MFL backfill (seasons 2011-2024)
        run: python scripts/mfl_historical_backfill.py

      - name: Show summary
        run: cat data/raw/mfl/historical_backfill_summary.csv

      # data/raw/ is intentionally gitignored across this project (only
      # data/manual/ is meant to be committed). scripts/mfl_client.py's
      # own manifest (scripts/mfl_source_manifest.json) IS tracked --
      # see that module's docstring -- but this workflow does not
      # commit it automatically; review and commit deliberately after
      # inspecting the summary and any snapshot-replacement warnings.
      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfl-historical-raw-data
          path: |
            data/raw/mfl/
            scripts/mfl_source_manifest.json
          retention-days: 14
